services:
  - type: web
    name: ai-daily-mentor-api
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: mentor-db, property: connectionString}
      - key: SECRET_KEY
        generateValue: true
  - type: web
    name: ai-daily-mentor-web
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
databases:
  - name: mentor-db
    plan: free
